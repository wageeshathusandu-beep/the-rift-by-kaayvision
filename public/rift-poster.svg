<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1b2a"/>
      <stop offset="50%" style="stop-color:#0a0a0f"/>
      <stop offset="100%" style="stop-color:#1b2838"/>
    </linearGradient>
    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff"/>
      <stop offset="100%" style="stop-color:#7b2ff7"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="600" height="900" fill="url(#bg)"/>
  <circle cx="300" cy="350" r="120" fill="none" stroke="url(#neon)" stroke-width="2" opacity="0.3"/>
  <circle cx="300" cy="350" r="80" fill="none" stroke="url(#neon)" stroke-width="1" opacity="0.2"/>
  <text x="300" y="550" text-anchor="middle" font-family="sans-serif" font-size="72" font-weight="900" fill="white" filter="url(#glow)">THE RIFT</text>
  <text x="300" y="600" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#00d4ff" opacity="0.8" letter-spacing="8">AI SCI-FI HORROR</text>
  <text x="300" y="650" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#666" letter-spacing="4">COMING 2025</text>
</svg>
